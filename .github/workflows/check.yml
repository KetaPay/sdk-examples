name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.1' }
      - name: Shared files are in sync
        run: node tools/sync-shared.mjs --check
      - name: Node files parse (servers, scenarios, tools; public/ is browser code)
        run: find . \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' -not -path '*/public/*' -not -path './tools/shared/*' -print0 | xargs -0 -n1 node --check
      - name: PHP files parse
        run: find . -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
