<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swapmart</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <p class="muted">Listing by Tunde Bello</p>
    <h1>iPhone 15 Pro Max, 256GB</h1>
    <p class="muted">Used, 91% battery, no scratches, Face ID works. Box and cable included.</p>
    <p class="price">₦450,000</p>
    <form method="post" action="/listings/iphone-15/buy">
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
      <button type="submit">Buy with escrow</button>
    </form>
    <p class="muted">Your money is held by KetaPay and only reaches the seller when you confirm the phone is as described.</p>
  </main>
</body>
</html>
