<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform admin · Swapmart</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="bar"><strong>Swapmart · platform admin</strong><a href="/">Listings</a></div></header>
  <main class="wrap split">
    <section class="card">
      <h1>Sales</h1>
      <p class="muted">Swapmart can see every sale but can't move the money: the buyer and seller each approve their own
        step. Your commission reaches your KetaPay balance when a sale completes.</p>
      <table><thead><tr><th>Item</th><th>Status</th><th>Commission</th><th>Open as</th></tr></thead><tbody id="orders"></tbody></table>
    </section>
    <aside class="card" id="activity"><h2>What's happening</h2><p class="muted">Pick a sale to see it on KetaPay.</p></aside>
  </main>
  <script type="module">
    import { showActivity } from './activity.js'
    const naira = (kobo) => `₦${(kobo / 100).toLocaleString('en-NG')}`
    let selected = null
    async function refresh() {
      const orders = await (await fetch('/orders')).json()
      document.getElementById('orders').replaceChildren(
        ...orders.map((o) => {
          const row = document.createElement('tr')
          row.innerHTML = '<td></td><td class="status"></td><td></td><td><a>buyer</a> · <a>seller</a></td>'
          row.cells[0].textContent = o.title
          row.cells[1].textContent = o.status.replace('_', ' ')
          row.cells[2].textContent = naira(o.commission)
          const [buyer, seller] = row.cells[3].querySelectorAll('a')
          buyer.href = `/order.html?order=${o.id}`
          seller.href = `/seller.html?order=${o.id}`
          row.onclick = () => ((selected = o.id), refresh())
          return row
        }),
      )
      if (selected) showActivity(document.getElementById('activity'), `/orders/${selected}/activity`)
    }
    refresh()
    setInterval(refresh, 4000)
  </script>
</body>
</html>
