<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your purchase · Swapmart</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="bar"><strong>Swapmart</strong><a href="/">Listings</a></div></header>
  <main class="wrap split">
    <section class="card">
      <p class="muted">You're buying</p>
      <h1 id="title">…</h1>
      <p>Status: <span class="status" id="status">loading…</span></p>
      <p class="muted" id="hint"></p>
      <div id="confirm" hidden>
        <h2>Confirm it arrived as described</h2>
        <p class="muted">This pays the seller. KetaPay emails you a code to make sure it's you.</p>
        <div class="row"><input id="code" placeholder="Code" inputmode="numeric"><button id="go"></button></div>
      </div>
    </section>
    <aside class="card" id="activity"></aside>
  </main>
  <script type="module">
    import { showActivity } from './activity.js'
    import { codeStep } from './code-step.js'
    const id = encodeURIComponent(new URLSearchParams(location.search).get('order'))
    const hints = {
      awaiting_payment: 'Waiting for KetaPay to confirm your payment.',
      paid: 'Paid. KetaPay holds your money until the seller sends it and you confirm.',
      shipped: 'The seller says it is on its way. Check it, then confirm below.',
      completed: 'Done. You confirmed and the seller has been paid.',
      refunded: 'Refunded to you.',
    }
    async function refresh() {
      const res = await fetch(`/orders/${id}`)
      if (!res.ok) return void (document.getElementById('status').textContent = 'not found')
      const order = await res.json()
      document.getElementById('title').textContent = order.title
      document.getElementById('status').textContent = order.status.replace('_', ' ')
      document.getElementById('hint').textContent = hints[order.status] ?? ''
      document.getElementById('confirm').hidden = order.status !== 'shipped'
      showActivity(document.getElementById('activity'), `/orders/${id}/activity`)
    }
    codeStep({
      button: document.getElementById('go'),
      input: document.getElementById('code'),
      codeUrl: `/orders/${id}/buyer/code`,
      confirmUrl: `/orders/${id}/buyer/confirm`,
      done: refresh,
    })
    refresh()
    setInterval(refresh, 4000)
  </script>
</body>
</html>
