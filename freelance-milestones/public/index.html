<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gigline</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Company website</h1>
    <p class="muted">A five-page marketing site, paid in three stages. Each stage is held by KetaPay and paid
      to the freelancer only when the client accepts it.</p>
    <ol>
      <li class="stage"><span>Design</span><span>₦400,000</span></li>
      <li class="stage"><span>Build</span><span>₦1,100,000</span></li>
      <li class="stage"><span>Launch</span><span>₦500,000</span></li>
    </ol>
    <form method="post" action="/projects">
      <label for="client">Client email</label>
      <input id="client" name="client" type="email" required placeholder="client@example.com">
      <label for="freelancer">Freelancer email</label>
      <input id="freelancer" name="freelancer" type="email" required placeholder="freelancer@example.com">
      <button type="submit">Fund the project</button>
    </form>
  </main>
</body>
</html>
