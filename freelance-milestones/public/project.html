<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Company website</h1>
    <p>Project: <span class="status" id="status">loading…</span></p>
    <ol id="stages"></ol>

    <!-- Each side proves who they are with a one-time code KetaPay sends them. In test mode it's 123456. -->
    <section id="freelancer" hidden>
      <h2>Freelancer: deliver <span class="current"></span></h2>
      <label for="note">What you delivered</label>
      <textarea id="note" rows="2" maxlength="160" placeholder="Homepage and about page designs"></textarea>
      <label for="link">Link to a file (PDF, image, Word or Excel, optional)</label>
      <input id="link" type="url" placeholder="https://…/designs.pdf">
      <div class="row"><input id="freelancer-code" placeholder="Code" inputmode="numeric"><button data-role="freelancer">Send code</button></div>
    </section>

    <section id="client" hidden>
      <h2>Client: accept <span class="current"></span></h2>
      <p class="muted" id="delivery"></p>
      <p class="muted">Accepting pays the freelancer for this stage.</p>
      <div class="row"><input id="client-code" placeholder="Code" inputmode="numeric"><button data-role="client">Send code</button></div>
    </section>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('project')
    const sessions = {}
    let current = null
    async function refresh() {
      const res = await fetch(`/projects/${encodeURIComponent(id)}`)
      if (!res.ok) return void (document.getElementById('status').textContent = 'not found')
      const project = await res.json()
      document.getElementById('status').textContent = project.status.replace('_', ' ')
      document.getElementById('stages').innerHTML = project.milestones
        .map((m) => `<li class="stage"><span>${m.title}</span><span>${m.status}</span></li>`)
        .join('')
      // Only the first stage not yet released can move
      current = project.milestones.find((m) => m.status === 'funded' || m.status === 'delivered') ?? null
      for (const el of document.querySelectorAll('.current')) el.textContent = current?.title ?? ''
      document.getElementById('freelancer').hidden = current?.status !== 'funded'
      document.getElementById('client').hidden = current?.status !== 'delivered'
      document.getElementById('delivery').textContent = current?.delivery?.note ? `Delivered: ${current.delivery.note}` : ''
    }
    for (const button of document.querySelectorAll('button[data-role]')) {
      button.onclick = async () => {
        const role = button.dataset.role
        const step = sessions[role] ? (role === 'freelancer' ? 'deliver' : 'release') : 'code'
        button.disabled = true
        const res = await fetch(`/projects/${encodeURIComponent(id)}/${role}/${step}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessions[role],
            code: document.getElementById(`${role}-code`).value,
            milestone_id: current?.id,
            note: document.getElementById('note').value,
            link: document.getElementById('link').value,
          }),
        })
        button.disabled = false
        const body = await res.json()
        if (!res.ok) return alert(body.error)
        if (step === 'code') {
          sessions[role] = body.session_id
          button.textContent = 'Confirm'
        } else {
          delete sessions[role]
          button.textContent = 'Send code'
          document.getElementById(`${role}-code`).value = ''
        }
        refresh()
      }
    }
    refresh()
    setInterval(refresh, 5000)
  </script>
</body>
</html>
