<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ade Gadgets</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="bar"><strong>Ade Gadgets</strong><a href="/admin.html">Shop admin</a></div></header>
  <main class="wrap">
    <section class="card">
      <h1>Pay with escrow</h1>
      <p class="muted">Your money is held by KetaPay, not by us, until you confirm your order arrived as described.
        If it doesn't, KetaPay steps in and you get it back.</p>
    </section>
    <section class="grid" id="products"></section>
  </main>
  <script type="module">
    const naira = (kobo) => `₦${(kobo / 100).toLocaleString('en-NG')}`
    const products = await (await fetch('/api/products')).json()
    document.getElementById('products').replaceChildren(
      ...products.map((p) => {
        const card = document.createElement('form')
        card.className = 'card'
        card.method = 'post'
        card.action = '/checkout'
        card.innerHTML = `<h2></h2><p class="price"></p>
          <input type="hidden" name="product"><label>Your email</label>
          <input name="email" type="email" required placeholder="you@example.com">
          <button type="submit">Pay with escrow</button>`
        card.querySelector('h2').textContent = p.name
        card.querySelector('.price').textContent = naira(p.price)
        card.querySelector('[name=product]').value = p.id
        return card
      }),
    )
  </script>
</body>
</html>
