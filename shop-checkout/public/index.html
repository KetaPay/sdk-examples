<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ade Gadgets</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Brass desk lamp</h1>
    <p class="muted">Warm LED bulb, brushed brass, boxed. Sold by this shop.</p>
    <p class="price">₦25,000</p>
    <form method="post" action="/checkout">
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
      <button type="submit">Pay with escrow</button>
    </form>
    <p class="muted">KetaPay holds your money until you confirm the lamp arrived as described.</p>
  </main>
</body>
</html>
