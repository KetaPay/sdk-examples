<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order · Ade Gadgets</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="bar"><strong>Ade Gadgets</strong><a href="/">Shop</a></div></header>
  <main class="wrap split">
    <section class="card">
      <h1 id="product">Your order</h1>
      <p>Status: <span class="status" id="status">loading…</span></p>
      <p class="muted" id="hint"></p>
      <p class="note">You confirm delivery with KetaPay, from the email it sends you when the shop ships. Only then is the
        shop paid.</p>
    </section>
    <aside class="card" id="activity"></aside>
  </main>
  <script type="module">
    import { showActivity } from './activity.js'
    const id = new URLSearchParams(location.search).get('order')
    const hints = {
      awaiting_payment: 'Waiting for KetaPay to confirm your payment.',
      paid: 'Paid. KetaPay holds your money while the shop packs your order.',
      shipped: 'On its way. Confirm with KetaPay when it arrives.',
      completed: 'Done. You confirmed delivery and the shop has been paid.',
      refunded: 'Refunded to you.',
    }
    async function refresh() {
      const res = await fetch(`/orders/${encodeURIComponent(id)}`)
      if (!res.ok) return void (document.getElementById('status').textContent = 'not found')
      const order = await res.json()
      document.getElementById('product').textContent = order.product
      document.getElementById('status').textContent = order.status.replace('_', ' ')
      document.getElementById('hint').textContent = hints[order.status] ?? ''
      showActivity(document.getElementById('activity'), `/orders/${encodeURIComponent(id)}/activity`)
    }
    refresh()
    setInterval(refresh, 4000)
  </script>
</body>
</html>
