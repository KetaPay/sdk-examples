<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your purchase · Keyhaus</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="bar"><strong>Keyhaus · buyer</strong><a id="other">Owner's view</a></div></header>
  <main class="wrap split">
    <section class="card">
      <p class="muted">You're buying</p>
      <h1 id="title">…</h1>
      <p>Sale: <span class="status" id="status">loading…</span></p>
      <ul class="steps" id="stages"></ul>
      <div id="accept" hidden>
        <h2>Accept <span class="current"></span></h2>
        <p class="note" id="delivery"></p>
        <p class="muted">Check it (with your lawyer, for documents) before accepting: accepting pays the owner for this stage.</p>
        <div class="row"><input id="code" placeholder="Code" inputmode="numeric"><button id="go"></button></div>
      </div>
    </section>
    <aside class="card" id="activity"></aside>
  </main>
  <script type="module">
    import { codeStep } from './code-step.js'
    import { loadSale, saleId } from './stages.js'
    document.getElementById('other').href = `/owner.html?sale=${saleId}`
    let current = null
    const refresh = () => loadSale((m) => {
      current = m
      document.getElementById('accept').hidden = m?.status !== 'delivered'
      const d = m?.delivery
      document.getElementById('delivery').textContent = d ? `Handed over: ${d.note ?? ''}${d.attachments.length ? ' (document attached)' : ''}` : ''
    })
    codeStep({
      button: document.getElementById('go'),
      input: document.getElementById('code'),
      codeUrl: `/sales/${saleId}/buyer/code`,
      confirmUrl: `/sales/${saleId}/buyer/accept`,
      extra: () => ({ milestone_id: current?.id }),
      done: refresh,
    })
    refresh()
    setInterval(refresh, 5000)
  </script>
</body>
</html>
